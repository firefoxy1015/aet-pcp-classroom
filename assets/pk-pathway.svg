<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">Drug journey and the clinical reassessment loop</title>
  <desc id="d">An extravascular dose is absorbed, distributed and eliminated. Intravenous dosing enters systemic circulation directly. The patient response must be reassessed.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#57d4cc" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="330" rx="20" fill="#0d2032"/>
  <g font-family="Arial,sans-serif" fill="#eef6ff" text-anchor="middle">
    <text x="480" y="36" font-size="22">PK sets exposure; PD connects exposure to response</text>
    <g fill="#173a50" stroke="#57d4cc" stroke-width="2"><rect x="26" y="111" width="177" height="92" rx="12"/><rect x="263" y="111" width="180" height="92" rx="12"/><rect x="503" y="111" width="180" height="92" rx="12"/><rect x="743" y="111" width="190" height="92" rx="12"/></g>
    <g font-size="19"><text x="114" y="145">Absorption</text><text x="353" y="145">Systemic blood</text><text x="593" y="145">Target tissues</text><text x="838" y="145">Elimination</text></g>
    <g font-size="15" fill="#c9dce9"><text x="114" y="176">Route + perfusion</text><text x="353" y="176">Free / bound drug</text><text x="593" y="176">Effect + harm</text><text x="838" y="176">Metabolism / excretion</text></g>
    <text x="353" y="79" font-size="16" fill="#ffcb78">IV enters here directly</text>
    <text x="480" y="270" font-size="19">Reassess the patient, not a predicted concentration alone</text>
    <text x="480" y="298" font-size="14" fill="#c9dce9">Original conceptual diagram; not a dosing or authorization chart</text>
  </g>
  <g stroke="#57d4cc" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M205 156H249"/><path d="M445 156H489"/><path d="M685 156H729"/><path d="M353 85V102"/></g>
</svg>
