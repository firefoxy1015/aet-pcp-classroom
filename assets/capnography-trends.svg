<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d">
  <title id="t">Conceptual capnography trends and the questions they prompt</title>
  <desc id="d">Three separate unlabeled-scale trends show stable values, an abrupt persistent rise and an abrupt fall. Each requires context rather than a threshold diagnosis.</desc>
  <rect width="1100" height="480" rx="20" fill="#f3f7fc"/>
  <g font-family="Arial,sans-serif">
    <text x="550" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#173047">TRENDS PROMPT ASSESSMENT, NOT A VERDICT</text>
    <g fill="#fff" stroke="#bed0df" stroke-width="2"><rect x="35" y="75" width="1030" height="102" rx="12"/><rect x="35" y="190" width="1030" height="102" rx="12"/><rect x="35" y="305" width="1030" height="102" rx="12"/></g>
    <g fill="#173047" font-size="21" font-weight="700"><text x="57" y="112">STABLE</text><text x="57" y="227">SUSTAINED RISE</text><text x="57" y="342">SUDDEN FALL</text></g>
    <g fill="#37566d" font-size="19"><text x="57" y="145">Context still matters</text><text x="57" y="260">Possible ROSC clue</text><text x="57" y="375">Patient AND circuit</text></g>
    <g stroke="#164f79" stroke-width="4" fill="none"><path d="M310 131 L365 127 L420 132 L475 128 L530 130 L585 127 L640 131 L695 128 L750 130 L805 129 L860 131 L915 128 L1035 130"/><path d="M310 267 L420 267 L530 265 L584 266 L605 222 L670 220 L730 222 L790 219 L850 222 L910 220 L1035 221"/><path d="M310 336 L420 338 L530 335 L585 336 L607 385 L670 386 L730 383 L790 386 L850 384 L910 387 L1035 386"/></g>
    <text x="550" y="447" text-anchor="middle" fill="#8a4033" font-size="20">Conceptual trend lines, not breath-by-breath waveforms or diagnostic cutoffs.</text>
  </g>
</svg>
