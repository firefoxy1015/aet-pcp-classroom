<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="Conduction is an electrical sequence, not proof of perfusion"><rect width="1100" height="525" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="43" font-size="29" fill="#123047" >Conduction is an electrical sequence, not proof of perfusion</text><rect x="55" y="90" width="280" height="95" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="78" y="127" font-size="28" fill="#123047" >SA node</text><text x="78" y="162" font-size="19" fill="#123047" >Usual pacemaker: 60-100/min</text><line x1="335" y1="137" x2="425" y2="137" stroke="#087f8c" stroke-width="4" /><text x="346" y="120" font-size="19" fill="#123047" >atria</text><rect x="425" y="90" width="280" height="95" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="448" y="127" font-size="28" fill="#123047" >AV junction</text><text x="448" y="162" font-size="18" fill="#123047" >Delay; escape often 40-60/min</text><line x1="705" y1="137" x2="785" y2="137" stroke="#087f8c" stroke-width="4" /><rect x="785" y="90" width="265" height="95" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="807" y="127" font-size="28" fill="#123047" >His bundle</text><text x="807" y="162" font-size="18" fill="#123047" >Into ventricular pathways</text><line x1="915" y1="185" x2="915" y2="235" stroke="#087f8c" stroke-width="4" /><line x1="650" y1="235" x2="1030" y2="235" stroke="#087f8c" stroke-width="3" /><rect x="560" y="270" width="240" height="80" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="580" y="318" font-size="22" fill="#123047" >Right bundle branch</text><rect x="825" y="270" width="240" height="80" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="845" y="318" font-size="22" fill="#123047" >Left bundle branch</text><line x1="680" y1="235" x2="680" y2="270" stroke="#087f8c" stroke-width="3" /><line x1="945" y1="235" x2="945" y2="270" stroke="#087f8c" stroke-width="3" /><rect x="560" y="390" width="505" height="75" rx="12" fill="#edf6f7" stroke="#b3cad2"/><text x="580" y="423" font-size="21" fill="#123047" >Purkinje network: rapid ventricular activation</text><text x="580" y="451" font-size="18" fill="#123047" >Ventricular escape is often slower, around 20-40/min</text><line x1="680" y1="350" x2="680" y2="390" stroke="#087f8c" stroke-width="3" /><line x1="945" y1="350" x2="945" y2="390" stroke="#087f8c" stroke-width="3" /><text x="55" y="295" font-size="22" fill="#123047" >P = atrial depolarization</text><text x="55" y="333" font-size="22" fill="#123047" >QRS = ventricular depolarization</text><text x="55" y="371" font-size="22" fill="#123047" >T = ventricular repolarization</text><text x="55" y="435" font-size="22" fill="#a64230" >Always assess the patient and pulse.</text><text x="35" y="507" font-size="16" fill="#586b75" >Original teaching schematic. Not a patient ECG or a diagnostic simulator.</text></g></svg>
