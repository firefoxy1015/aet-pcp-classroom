<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" role="img" aria-labelledby="t d">
<title id="t">Negative feedback opposes a disturbance</title><desc id="d">A regulated variable is sensed and compared. An effector responds, reducing the disturbance. Original teaching schematic, not a diagnostic algorithm.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#006c72"/></marker></defs>
<rect width="1120" height="270" rx="12" fill="#f2f8f7"/>
<g fill="#fff" stroke="#94c1bd" stroke-width="2"><rect x="25" y="50" width="235" height="100" rx="8"/><rect x="310" y="50" width="235" height="100" rx="8"/><rect x="595" y="50" width="235" height="100" rx="8"/><rect x="880" y="50" width="215" height="100" rx="8"/></g>
<g font-family="Arial,sans-serif" font-size="22" fill="#193039" text-anchor="middle"><text x="142" y="88">Variable changes</text><text x="142" y="119" font-size="18">e.g. body temperature</text><text x="427" y="88">Sense and compare</text><text x="427" y="119" font-size="18">regulated range</text><text x="712" y="88">Effector responds</text><text x="712" y="119" font-size="18">opposes disturbance</text><text x="988" y="88">Error decreases</text><text x="988" y="119" font-size="18">response adjusts</text></g>
<g fill="none" stroke="#006c72" stroke-width="3" marker-end="url(#a)"><path d="M260 100 H303"/><path d="M545 100 H588"/><path d="M830 100 H873"/><path d="M988 150 V207 H142 V157"/></g>
<text x="560" y="247" fill="#52696f" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Negative = counteracting a deviation, not bad. Schematic; not a treatment protocol.</text>
</svg>
