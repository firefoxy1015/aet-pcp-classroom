<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-label="One beat: valves, pressure and volume"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1100" height="605" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="29" fill="#17384b" >One beat: valves, pressure and volume</text><text x="35" y="86" font-size="21" fill="#17384b" >A left-ventricular learning model: pressure differences operate the valves.</text><rect x="35" y="110" width="1030" height="55" rx="12" fill="#dcecef" stroke="#9ebac7" stroke-width="2"/><text x="45" y="145" font-size="20" fill="#17384b" >Ventricular phase</text><text x="315" y="145" font-size="20" fill="#17384b" >AV valves</text><text x="475" y="145" font-size="20" fill="#17384b" >Semilunar</text><text x="675" y="145" font-size="20" fill="#17384b" >LV volume</text><text x="850" y="145" font-size="20" fill="#17384b" >Pressure relationship</text><rect x="35" y="178" width="1030" height="65" rx="12" fill="#edf6f7" stroke="#9ebac7" stroke-width="2"/><text x="45" y="218" font-size="19" fill="#17384b" >Filling</text><text x="315" y="218" font-size="18" fill="#17384b" >Open</text><text x="475" y="218" font-size="18" fill="#17384b" >Closed</text><text x="675" y="218" font-size="18" fill="#17384b" >Increases</text><text x="850" y="218" font-size="18" fill="#17384b" >Atrium &gt; ventricle</text><rect x="35" y="255" width="1030" height="65" rx="12" fill="#f5f1e5" stroke="#9ebac7" stroke-width="2"/><text x="45" y="295" font-size="19" fill="#17384b" >Isovolumetric contraction</text><text x="315" y="295" font-size="18" fill="#17384b" >Closed</text><text x="475" y="295" font-size="18" fill="#17384b" >Closed</text><text x="675" y="295" font-size="18" fill="#17384b" >Unchanged</text><text x="850" y="295" font-size="18" fill="#17384b" >LV rising; no ejection</text><rect x="35" y="332" width="1030" height="65" rx="12" fill="#edf6f7" stroke="#9ebac7" stroke-width="2"/><text x="45" y="372" font-size="19" fill="#17384b" >Ejection</text><text x="315" y="372" font-size="18" fill="#17384b" >Closed</text><text x="475" y="372" font-size="18" fill="#17384b" >Open</text><text x="675" y="372" font-size="18" fill="#17384b" >Decreases</text><text x="850" y="372" font-size="18" fill="#17384b" >Ventricle &gt; outflow</text><rect x="35" y="409" width="1030" height="65" rx="12" fill="#f5f1e5" stroke="#9ebac7" stroke-width="2"/><text x="45" y="449" font-size="19" fill="#17384b" >Isovolumetric relaxation</text><text x="315" y="449" font-size="18" fill="#17384b" >Closed</text><text x="475" y="449" font-size="18" fill="#17384b" >Closed</text><text x="675" y="449" font-size="18" fill="#17384b" >Unchanged</text><text x="850" y="449" font-size="18" fill="#17384b" >LV falling; no filling</text><text x="35" y="512" font-size="21" fill="#17384b" >S1: associated with AV closure. S2: associated with semilunar closure.</text><text x="35" y="548" font-size="20" fill="#17384b" >Filling resumes after ventricular pressure falls below atrial pressure and AV valves reopen.</text><text x="35" y="585" font-size="16" fill="#587080" >Original model. Electrical activation precedes mechanical pressure/flow; the ECG does not measure output.</text></g></svg>