<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="t d">
<title id="t">Typical time capnogram</title><desc id="d">Near-zero dead space, expiratory upstroke, alveolar plateau and inspiratory downstroke. The end tidal point is near the end of the plateau. This is an original schematic with no patient values.</desc>
<rect width="1120" height="330" rx="12" fill="#f2f8f7"/>
<path d="M70 38 V260 H1060" fill="none" stroke="#83999e" stroke-width="2"/>
<path d="M85 245 H270 L325 105 L715 85 L750 245 H1025" fill="none" stroke="#006c72" stroke-width="5" stroke-linejoin="round"/>
<circle cx="715" cy="85" r="7" fill="#a06011"/>
<g font-family="Arial,sans-serif" fill="#193039" text-anchor="middle" font-size="21"><text x="170" y="221">I: dead space</text><text x="250" y="132">II</text><text x="510" y="66">III: alveolar plateau</text><text x="882" y="181">Inspiration</text><text x="830" y="52">End-tidal point</text><text x="560" y="300" font-size="18" fill="#52696f">Time runs left to right. Shape is illustrative, not a diagnosis or device calibration.</text></g>
<path d="M806 57 L725 80" stroke="#a06011" stroke-width="2"/>
<text x="33" y="147" fill="#52696f" font-family="Arial,sans-serif" font-size="18" transform="rotate(-90 33 147)">Exhaled CO2</text>
</svg>
