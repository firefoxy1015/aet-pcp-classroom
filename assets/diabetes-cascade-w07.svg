<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">DKA: connected fluid loss and ketone-acid pathways</title>
  <desc id="desc">Insufficient effective insulin and counter-regulatory stress can increase hepatic glucose output and lipolysis. Glucose-associated osmotic urine losses cause volume and electrolyte depletion. Ketone production causes metabolic acidosis and compensatory ventilation. One glucose measurement does not quantify all these problems.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a5d2dc"/></marker></defs>
  <rect width="1200" height="440" rx="20" fill="#0b1929"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#edf6fb">
    <text x="600" y="38" font-size="26" font-weight="700">DKA: insulin deficiency connects two major physiological problems.</text>
    <rect x="190" y="65" width="820" height="54" rx="12" fill="#354154" stroke="#95aeca"/>
    <text x="600" y="99" font-size="23" font-weight="700">Insufficient effective insulin + counter-regulatory stress</text>
    <rect x="45" y="166" width="480" height="71" rx="12" fill="#1d4856" stroke="#70becb"/>
    <text x="285" y="197" font-size="22" font-weight="700">Glucose output / impaired handling</text>
    <text x="285" y="224" font-size="19">Osmotic urine water and electrolyte loss</text>
    <rect x="675" y="166" width="480" height="71" rx="12" fill="#4c3543" stroke="#bc91ab"/>
    <text x="915" y="197" font-size="22" font-weight="700">Lipolysis and ketone production</text>
    <text x="915" y="224" font-size="19">Ketone-associated metabolic acidosis</text>
    <path d="M420 122 V155 H285 V159" fill="none" stroke="#a5d2dc" stroke-width="3" marker-end="url(#a)"/>
    <path d="M780 122 V155 H915 V159" fill="none" stroke="#a5d2dc" stroke-width="3" marker-end="url(#a)"/>
    <rect x="45" y="280" width="480" height="69" rx="12" fill="#1d4856" stroke="#70becb"/>
    <text x="285" y="310" font-size="22">Depletion and impaired perfusion</text>
    <text x="285" y="337" font-size="19">Potassium loss can coexist with high blood K</text>
    <rect x="675" y="280" width="480" height="69" rx="12" fill="#4c3543" stroke="#bc91ab"/>
    <text x="915" y="310" font-size="22">Compensatory deep ventilation</text>
    <text x="915" y="337" font-size="19">Fatigue or lost compensation can worsen pH</text>
    <path d="M285 240 V272" stroke="#a5d2dc" stroke-width="3" marker-end="url(#a)"/>
    <path d="M915 240 V272" stroke="#a5d2dc" stroke-width="3" marker-end="url(#a)"/>
    <text x="600" y="399" font-size="21" font-weight="700">Glucose alone cannot quantify the ketones, acidosis, fluid loss or total potassium.</text>
  </g>
</svg>
