<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Patient-first respiratory support branches</title>
  <desc id="desc">Adequate spontaneous effort with full eligibility may permit CPAP. Inadequate breathing needs assisted ventilation. PEEP is a separate screened choice after good BVM with persistent hypoxemia. Every branch requires reassessment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#9aadc6" stroke-width="2"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="#101c2d"/>
  <text x="52" y="57" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#f3f7ff">Support the function that is failing</text>
  <text x="52" y="93" font-family="Arial,sans-serif" font-size="21" fill="#b7c9e2">An oxygen number alone does not select the device.</text>
  <rect x="355" y="125" width="490" height="92" rx="16" fill="#233a56" stroke="#8dbbfa" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#f3f7ff">Assess airway, breathing and perfusion</text>
  <text x="600" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d3e2f6">Adequate spontaneous effort and protection?</text>
  <path d="M475 217L300 275" stroke="#9aadc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M725 217L900 275" stroke="#9aadc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="95" y="245" font-family="Arial,sans-serif" font-size="20" fill="#74dbc3">Yes, and full screen passed</text>
  <text x="855" y="241" font-family="Arial,sans-serif" font-size="20" fill="#ffbf9a">No</text>
  <rect x="65" y="280" width="485" height="135" rx="16" fill="#173f3c" stroke="#74dbc3" stroke-width="2"/>
  <text x="92" y="319" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#e4fff8">Consider CPAP</text>
  <text x="92" y="354" font-family="Arial,sans-serif" font-size="22" fill="#c8f1e6">Actual device chart, tolerance and ceiling</text>
  <text x="92" y="389" font-family="Arial,sans-serif" font-size="22" fill="#c8f1e6">No mandatory rescue breaths</text>
  <rect x="650" y="280" width="485" height="135" rx="16" fill="#4a302d" stroke="#ffbf9a" stroke-width="2"/>
  <text x="677" y="319" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff0e8">Assist ventilation</text>
  <text x="677" y="354" font-family="Arial,sans-serif" font-size="22" fill="#ffdbca">Effective airway, seal and BVM technique</text>
  <text x="677" y="389" font-family="Arial,sans-serif" font-size="22" fill="#ffdbca">PEEP only if separately eligible</text>
  <path d="M307 415L420 475" stroke="#9aadc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M892 415L780 475" stroke="#9aadc6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="195" y="485" width="810" height="105" rx="16" fill="#27334a" stroke="#c4b6fc" stroke-width="2"/>
  <text x="600" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#f3f0ff">Reassess function, not just the saturation</text>
  <text x="600" y="561" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ded8f8">Worsening effort, mentation, airway or pressure: stop and change support</text>
  <text x="600" y="639" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#a9bad0">Original teaching map. Full procedure, role and patient-specific exclusions still apply.</text>
</svg>
