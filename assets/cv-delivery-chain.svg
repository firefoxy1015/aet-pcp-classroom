<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="From vascular entry to tissue delivery and return"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1100" height="525" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="29" fill="#17384b" >From vascular entry to tissue delivery and return</text><text x="35" y="85" font-size="21" fill="#17384b" >Follow one serial circuit. Valves guard flow; artery/vein names describe direction.</text><rect x="55" y="135" width="225" height="95" rx="12" fill="#e5f2f8" stroke="#9ebac7" stroke-width="2"/><text x="67" y="168" font-size="22" fill="#17384b" >Right atrium</text><text x="67" y="199" font-size="17" fill="#17384b" >Systemic venous return</text><rect x="310" y="135" width="225" height="95" rx="12" fill="#e5f2f8" stroke="#9ebac7" stroke-width="2"/><text x="322" y="168" font-size="22" fill="#17384b" >Right ventricle</text><text x="322" y="199" font-size="17" fill="#17384b" >Pulmonary pump</text><rect x="565" y="135" width="225" height="95" rx="12" fill="#e5f2f8" stroke="#9ebac7" stroke-width="2"/><text x="577" y="168" font-size="22" fill="#17384b" >Pulmonary arteries</text><text x="577" y="199" font-size="17" fill="#17384b" >Away from right heart</text><rect x="820" y="135" width="225" height="95" rx="12" fill="#eeeafa" stroke="#9ebac7" stroke-width="2"/><text x="832" y="168" font-size="22" fill="#17384b" >Lung capillaries</text><text x="832" y="199" font-size="17" fill="#17384b" >Gas exchange</text><rect x="820" y="335" width="225" height="95" rx="12" fill="#fbe8e3" stroke="#9ebac7" stroke-width="2"/><text x="832" y="368" font-size="22" fill="#17384b" >Pulmonary veins</text><text x="832" y="399" font-size="17" fill="#17384b" >Return toward left heart</text><rect x="565" y="335" width="225" height="95" rx="12" fill="#fbe8e3" stroke="#9ebac7" stroke-width="2"/><text x="577" y="368" font-size="22" fill="#17384b" >Left atrium</text><text x="577" y="399" font-size="17" fill="#17384b" >Receiving chamber</text><rect x="310" y="335" width="225" height="95" rx="12" fill="#fbe8e3" stroke="#9ebac7" stroke-width="2"/><text x="322" y="368" font-size="22" fill="#17384b" >Left ventricle</text><text x="322" y="399" font-size="17" fill="#17384b" >Systemic pump</text><rect x="55" y="335" width="225" height="95" rx="12" fill="#f4efdc" stroke="#9ebac7" stroke-width="2"/><text x="67" y="368" font-size="22" fill="#17384b" >Systemic tissues</text><text x="67" y="399" font-size="17" fill="#17384b" >Exchange and extraction</text><path d="M280,182 L310,182" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M535,182 L565,182" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M790,182 L820,182" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M820,382 L790,382" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M565,382 L535,382" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M310,382 L280,382" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><path d="M932,230 L932,335" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><text x="944" y="288" font-size="17" fill="#17384b" >Return</text><path d="M167,335 L167,230" fill="none" stroke="#225b72" stroke-width="3" marker-end="url(#arrow)"/><text x="181" y="282" font-size="17" fill="#17384b" >Systemic veins</text><text x="278" y="122" font-size="17" fill="#17384b" >Tricuspid</text><text x="512" y="122" font-size="17" fill="#17384b" >Pulmonary valve</text><text x="560" y="460" font-size="18" fill="#17384b" >Mitral valve: left atrium -&gt; left ventricle</text><text x="55" y="460" font-size="18" fill="#17384b" >Aortic valve/aorta: left ventricle -&gt; tissues</text><text x="35" y="505" font-size="16" fill="#587080" >Original simplified schematic. Colors show relative oxygenation, not literal blood color or measured saturation.</text></g></svg>