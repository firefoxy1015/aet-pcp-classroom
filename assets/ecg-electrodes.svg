<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625" role="img" aria-label="Precordial placement: landmark, do not use nipple position"><rect width="1100" height="625" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="43" font-size="29" fill="#123047" >Precordial placement: landmark, do not use nipple position</text><text x="55" y="85" font-size="19" fill="#123047" >Front-view schematic: patient right is on your left. Not a scale anatomy drawing.</text><path d="M 315 155 Q 390 130 410 115 Q 430 130 505 155 L 650 205 L 625 475 Q 410 520 250 475 L 225 205 Z" fill="#edf3f4" stroke="#79919a" stroke-width="3"/><line x1="390" y1="145" x2="390" y2="455" stroke="#79919a" stroke-width="12" /><text x="260" y="135" font-size="18" fill="#123047" >RIGHT</text><text x="535" y="135" font-size="18" fill="#123047" >LEFT</text><line x1="300" y1="290" x2="440" y2="290" stroke="#b3cad2" stroke-width="2" stroke-dasharray="4 5"/><line x1="400" y1="342" x2="645" y2="342" stroke="#087f8c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="370" cy="290" r="15" fill="#087f8c"/><text x="356" y="266" font-size="20" fill="#123047" >V1</text><circle cx="412" cy="290" r="15" fill="#087f8c"/><text x="398" y="266" font-size="20" fill="#123047" >V2</text><circle cx="455" cy="316" r="15" fill="#087f8c"/><text x="441" y="292" font-size="20" fill="#123047" >V3</text><circle cx="500" cy="342" r="15" fill="#087f8c"/><text x="486" y="318" font-size="20" fill="#123047" >V4</text><circle cx="567" cy="342" r="15" fill="#087f8c"/><text x="553" y="318" font-size="20" fill="#123047" >V5</text><circle cx="630" cy="342" r="15" fill="#087f8c"/><text x="616" y="318" font-size="20" fill="#123047" >V6</text><text x="55" y="225" font-size="21" fill="#123047" >V1: 4th space,</text><text x="55" y="254" font-size="21" fill="#123047" >right sternal edge</text><text x="750" y="205" font-size="21" fill="#123047" >V2: 4th space,</text><text x="750" y="234" font-size="21" fill="#123047" >left sternal edge</text><text x="750" y="300" font-size="21" fill="#123047" >V4: 5th space,</text><text x="750" y="329" font-size="21" fill="#123047" >mid-clavicular line</text><text x="750" y="395" font-size="21" fill="#123047" >V3: between V2/V4</text><text x="55" y="540" font-size="20" fill="#123047" >V5: anterior axillary line. V6: mid-axillary line. Keep V4-V6 in one horizontal plane.</text><text x="55" y="575" font-size="19" fill="#123047" >Expose respectfully, identify the sternal angle and count spaces with supervised practice.</text><text x="35" y="607" font-size="16" fill="#586b75" >Original teaching schematic. Not a patient ECG or a diagnostic simulator.</text></g></svg>
