<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">One-to-two-to-one genotype possibilities</title>
  <desc id="desc">In a complete-dominance Gg by Gg model, the four equally likely combinations are GG, Gg, gG and gg. The two mixed combinations are the same heterozygous genotype. Probabilities apply to each conception, not an ordered sequence of children.</desc>
  <rect width="640" height="430" rx="18" fill="#f4f8fb"/>
  <g font-family="Arial, sans-serif" fill="#183750">
    <text x="24" y="34" font-size="25" font-weight="700">Gg x Gg: four possible combinations</text>
    <text x="24" y="64" font-size="18">Simplified complete-dominance model; two heterozygotes</text>
    <text x="285" y="103" text-anchor="middle" font-size="26" font-weight="700">G</text>
    <text x="495" y="103" text-anchor="middle" font-size="26" font-weight="700">g</text>
    <text x="142" y="182" text-anchor="middle" font-size="26" font-weight="700">G</text>
    <text x="142" y="294" text-anchor="middle" font-size="26" font-weight="700">g</text>
    <rect x="184" y="116" width="202" height="100" rx="12" fill="#d4edf0"/>
    <rect x="394" y="116" width="202" height="100" rx="12" fill="#e2ebff"/>
    <rect x="184" y="228" width="202" height="100" rx="12" fill="#e2ebff"/>
    <rect x="394" y="228" width="202" height="100" rx="12" fill="#ffe8b3"/>
    <text x="285" y="162" text-anchor="middle" font-size="34" font-weight="700">GG</text>
    <text x="495" y="162" text-anchor="middle" font-size="34" font-weight="700">Gg</text>
    <text x="285" y="274" text-anchor="middle" font-size="34" font-weight="700">gG</text>
    <text x="495" y="274" text-anchor="middle" font-size="34" font-weight="700">gg</text>
    <text x="285" y="199" text-anchor="middle" font-size="19">Two capital alleles</text>
    <text x="495" y="199" text-anchor="middle" font-size="19">Mixed pair</text>
    <text x="285" y="311" text-anchor="middle" font-size="19">Same mixed genotype</text>
    <text x="495" y="311" text-anchor="middle" font-size="19">Two lowercase alleles</text>
    <text x="24" y="366" font-size="23" font-weight="700">Genotype 1:2:1; phenotype 3:1 in this model.</text>
    <text x="24" y="399" font-size="19">Each conception is a new probability - not an order of children.</text>
  </g>
</svg>
