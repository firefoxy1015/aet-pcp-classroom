<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="t d">
<title id="t">S1 to S4: relative timing</title><desc id="d">S1 starts systole, S2 ends systole, S3 is early diastolic after S2 and S4 is late diastolic before the next S1. Positions are schematic, not measured intervals.</desc>
<rect width="1120" height="300" rx="12" fill="#f2f8f7"/>
<rect x="115" y="57" width="330" height="36" fill="#cbe5e1"/><rect x="445" y="57" width="505" height="36" fill="#e9e0c9"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#193039"><text x="280" y="82" font-size="22">Systole</text><text x="695" y="82" font-size="22">Diastole</text></g>
<path d="M55 160 H1060" fill="none" stroke="#83999e" stroke-width="2"/>
<g stroke="#006c72" stroke-width="4" fill="none"><path d="M105 160 l5 -25 l5 64 l5 -82 l5 60 l5 -17 M435 160 l5 -18 l5 48 l5 -64 l5 47 l5 -13 M520 160 q8 -30 16 0 q8 24 16 0 M850 160 q8 -28 16 0 q8 23 16 0 M940 160 l5 -25 l5 64 l5 -82 l5 60 l5 -17"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#193039" font-size="24"><text x="118" y="232">S1</text><text x="448" y="232">S2</text><text x="535" y="232">S3</text><text x="865" y="232">S4</text><text x="954" y="232">S1</text></g>
<text x="560" y="275" fill="#52696f" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Timing concept only. S3/S4 are not present in every person; this is not a real phonocardiogram.</text>
</svg>
