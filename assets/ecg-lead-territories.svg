<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Lead groups: localization without false certainty"><rect width="1100" height="600" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="43" font-size="29" fill="#123047" >Lead groups: localization without false certainty</text><text x="55" y="85" font-size="20" fill="#123047" >10 physical electrodes create 12 electrical views. Territories are teaching approximations.</text><text x="70" y="130" font-size="27" fill="#123047" >Frontal views</text><rect x="55" y="150" width="490" height="43" rx="12" fill="#e4f3e6" stroke="#b3cad2"/><text x="73" y="180" font-size="22" fill="#123047" >I: lateral</text><rect x="55" y="202" width="490" height="43" rx="12" fill="#ffecd3" stroke="#b3cad2"/><text x="73" y="232" font-size="22" fill="#123047" >II: inferior</text><rect x="55" y="254" width="490" height="43" rx="12" fill="#ffecd3" stroke="#b3cad2"/><text x="73" y="284" font-size="22" fill="#123047" >III: inferior</text><rect x="55" y="306" width="490" height="43" rx="12" fill="#e7effb" stroke="#b3cad2"/><text x="73" y="336" font-size="22" fill="#123047" >aVR: rightward</text><rect x="55" y="358" width="490" height="43" rx="12" fill="#e4f3e6" stroke="#b3cad2"/><text x="73" y="388" font-size="22" fill="#123047" >aVL: high lateral</text><rect x="55" y="410" width="490" height="43" rx="12" fill="#ffecd3" stroke="#b3cad2"/><text x="73" y="440" font-size="22" fill="#123047" >aVF: inferior</text><text x="600" y="130" font-size="27" fill="#123047" >Horizontal views</text><rect x="585" y="150" width="490" height="43" rx="12" fill="#e7effb" stroke="#b3cad2"/><text x="603" y="180" font-size="22" fill="#123047" >V1: septal/rightward view</text><rect x="585" y="202" width="490" height="43" rx="12" fill="#e7effb" stroke="#b3cad2"/><text x="603" y="232" font-size="22" fill="#123047" >V2: septal view</text><rect x="585" y="254" width="490" height="43" rx="12" fill="#e7effb" stroke="#b3cad2"/><text x="603" y="284" font-size="22" fill="#123047" >V3: anterior</text><rect x="585" y="306" width="490" height="43" rx="12" fill="#e7effb" stroke="#b3cad2"/><text x="603" y="336" font-size="22" fill="#123047" >V4: anterior</text><rect x="585" y="358" width="490" height="43" rx="12" fill="#e4f3e6" stroke="#b3cad2"/><text x="603" y="388" font-size="22" fill="#123047" >V5: lateral</text><rect x="585" y="410" width="490" height="43" rx="12" fill="#e4f3e6" stroke="#b3cad2"/><text x="603" y="440" font-size="22" fill="#123047" >V6: lateral</text><text x="55" y="512" font-size="20" fill="#123047" >Inferior supply is often RCA, sometimes circumflex; anterior/septal often LAD.</text><text x="55" y="545" font-size="20" fill="#123047" >Lateral supply varies. An ECG cannot prove the exact culprit artery in every person.</text><text x="35" y="582" font-size="16" fill="#586b75" >Original teaching schematic. Not a patient ECG or a diagnostic simulator.</text></g></svg>
