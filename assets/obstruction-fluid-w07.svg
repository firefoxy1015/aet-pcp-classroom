<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Obstruction, fluid sequestration and perfusion</title>
  <desc id="desc">Obstruction causes upstream accumulation. Fluid sequestered in the bowel lumen and wall plus vomiting can reduce effective circulating volume. Pressure or a trapped loop can also threaten bowel perfusion. These are possible mechanisms, not mandatory timed stages.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9ad2dc"/></marker></defs>
  <rect width="1200" height="440" rx="20" fill="#0d1b2b"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#edf6fb">
    <text x="600" y="40" font-size="26" font-weight="700">The bowel can swell while effective circulating volume falls.</text>
    <rect x="35" y="85" width="280" height="110" rx="12" fill="#394153" stroke="#91a7c3"/>
    <text x="175" y="123" font-size="24" font-weight="700">Obstruction</text>
    <text x="175" y="160" font-size="20">Upstream fluid / gas builds</text>
    <rect x="440" y="70" width="330" height="100" rx="12" fill="#244756" stroke="#70b8ca"/>
    <text x="605" y="108" font-size="22" font-weight="700">Fluid sequestration</text>
    <text x="605" y="143" font-size="20">Lumen + edematous wall</text>
    <rect x="440" y="205" width="330" height="90" rx="12" fill="#4c3b3a" stroke="#bf9e8f"/>
    <text x="605" y="242" font-size="22" font-weight="700">Vomiting</text>
    <text x="605" y="274" font-size="20">External water / electrolyte loss</text>
    <rect x="885" y="110" width="280" height="150" rx="12" fill="#184c50" stroke="#6dc7bd"/>
    <text x="1025" y="150" font-size="23" font-weight="700">Less effective</text>
    <text x="1025" y="181" font-size="23" font-weight="700">circulating volume</text>
    <text x="1025" y="227" font-size="20">Perfusion / kidney risk</text>
    <path d="M320 130 H410 V120 H430" fill="none" stroke="#9ad2dc" stroke-width="3" marker-end="url(#a)"/>
    <path d="M410 130 V250 H430" fill="none" stroke="#9ad2dc" stroke-width="3" marker-end="url(#a)"/>
    <path d="M775 120 H825 V170 H875" fill="none" stroke="#9ad2dc" stroke-width="3" marker-end="url(#a)"/>
    <path d="M775 250 H825 V205 H875" fill="none" stroke="#9ad2dc" stroke-width="3" marker-end="url(#a)"/>
    <rect x="75" y="335" width="1050" height="72" rx="12" fill="#47303b" stroke="#b88ba5"/>
    <text x="600" y="364" font-size="21" font-weight="700">Pressure or a trapped loop may also impair bowel blood flow.</text>
    <text x="600" y="392" font-size="19">Constant severe pain, tenderness or deterioration needs urgent reassessment and escalation.</text>
  </g>
</svg>
