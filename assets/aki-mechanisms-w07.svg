<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Acute kidney injury: perfusion, tissue and drainage</title>
  <desc id="desc">Three connected mechanisms. Prerenal injury reduces effective incoming perfusion. Intrinsic injury affects nephron tissue. Postrenal obstruction impedes urine leaving the kidney. Mechanisms can coexist and a low urine output alone does not prescribe fluid.</desc>
  <rect width="1200" height="440" rx="20" fill="#0c1928"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#eef6fb">
    <text x="600" y="42" font-size="27" font-weight="700">Three mechanisms. Different questions before fluid.</text>
    <rect x="35" y="90" width="340" height="205" rx="14" fill="#253f57" stroke="#7da9c5"/>
    <text x="205" y="127" font-size="25" font-weight="700">PRERENAL</text>
    <text x="205" y="166" font-size="22">Reduced effective perfusion</text>
    <text x="205" y="203" font-size="20">Fluid loss / shock / low output</text>
    <text x="205" y="263" font-size="20" fill="#b5e8f0">What is limiting circulation?</text>
    <rect x="430" y="90" width="340" height="205" rx="14" fill="#44354d" stroke="#b59ac5"/>
    <text x="600" y="127" font-size="25" font-weight="700">INTRINSIC</text>
    <text x="600" y="166" font-size="22">Injury within kidney tissue</text>
    <text x="600" y="203" font-size="20">Ischemia / inflammation / toxin</text>
    <text x="600" y="263" font-size="20" fill="#e2c6ef">Which insult and complications?</text>
    <rect x="825" y="90" width="340" height="205" rx="14" fill="#4e3d32" stroke="#c5ac91"/>
    <text x="995" y="127" font-size="25" font-weight="700">POSTRENAL</text>
    <text x="995" y="166" font-size="22">Obstructed urine outflow</text>
    <text x="995" y="203" font-size="20">Significant drainage / outlet block</text>
    <text x="995" y="263" font-size="20" fill="#f0d1af">Can urine leave the system?</text>
    <text x="600" y="337" font-size="20">Prolonged low flow can add tissue injury. Sepsis can involve several mechanisms.</text>
    <rect x="100" y="365" width="1000" height="49" rx="12" fill="#194752" stroke="#65b9b8"/>
    <text x="600" y="397" font-size="22" font-weight="700">Low urine output: assess breathing, perfusion, history and drainage. Reassess.</text>
  </g>
</svg>
