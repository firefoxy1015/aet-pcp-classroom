<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
  <title id="title">Four different chest-drain questions</title>
  <desc id="desc">Original functional concept map separating collection, one-way seal, prescribed suction and a device-specific indicator. This is not a tubing or operating diagram.</desc>
  <rect width="640" height="680" rx="18" fill="#f3f8f8"/>
  <g font-family="Arial, sans-serif" fill="#123c48">
    <text x="28" y="42" font-size="29" font-weight="700">Four different drain questions</text>
    <text x="28" y="73" font-size="20">Functional map, not connections or operating steps</text>
    <rect x="24" y="96" width="592" height="118" rx="12" fill="#dcecf4" stroke="#326c89"/>
    <text x="44" y="130" font-size="27" font-weight="700">COLLECTION</text>
    <text x="44" y="164" font-size="23">What amount and type of output is collected?</text>
    <text x="44" y="195" font-size="21">Read the marks and trend in clinical context.</text>
    <rect x="24" y="230" width="592" height="118" rx="12" fill="#dcefe9" stroke="#387965"/>
    <text x="44" y="264" font-size="27" font-weight="700">SEAL / AIR-LEAK AREA</text>
    <text x="44" y="298" font-size="23">What does air movement mean in this device?</text>
    <text x="44" y="329" font-size="21">Chamber, pattern, indication and patient matter.</text>
    <rect x="24" y="364" width="592" height="118" rx="12" fill="#fff0d5" stroke="#997338"/>
    <text x="44" y="398" font-size="27" font-weight="700">PRESCRIBED SUCTION</text>
    <text x="44" y="432" font-size="23">Is suction ordered, and what is selected?</text>
    <text x="44" y="463" font-size="21">Not every drain needs routine suction.</text>
    <rect x="24" y="498" width="592" height="118" rx="12" fill="#e9e4f4" stroke="#706087"/>
    <text x="44" y="532" font-size="27" font-weight="700">DEVICE INDICATOR</text>
    <text x="44" y="566" font-size="23">Is this particular mechanism functioning?</text>
    <text x="44" y="597" font-size="21">A bellows is not an output or recovery score.</text>
    <text x="28" y="650" font-size="21" font-weight="700">Assess the patient + identify the actual authorized setup.</text>
  </g>
</svg>
