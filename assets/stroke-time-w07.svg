<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Last known well is not discovery time</title>
  <desc id="desc">An original assumed wake-up example has last known well at22:10 on the previous evening, symptoms discovered at06:20 and crew assessment at06:37. Actual onset is unknown. All dates, times and witness sources must be reported.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#9aadc6" stroke-width="2"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="#101c2d"/>
  <text x="48" y="57" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#f3f7ff">Keep three times separate</text>
  <text x="48" y="96" font-family="Arial,sans-serif" font-size="22" fill="#b7c9e2">Original wake-up example. Actual onset remains unknown.</text>
  <path d="M125 265H1072" stroke="#9aadc6" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#74dbc3" stroke="#101c2d" stroke-width="4"><circle cx="185" cy="265" r="14"/><circle cx="605" cy="265" r="14"/><circle cx="1005" cy="265" r="14"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="35" font-weight="bold" fill="#f3f7ff"><text x="185" y="218">22:10</text><text x="605" y="218">06:20</text><text x="1005" y="218">06:37</text></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="23" fill="#c8d9ef"><text x="185" y="165">Previous evening</text><text x="605" y="165">Next morning</text><text x="1005" y="165">Crew contact</text></g>
  <g fill="#233a56"><rect x="45" y="310" width="280" height="125" rx="16"/><rect x="465" y="310" width="280" height="125" rx="16"/><rect x="865" y="310" width="280" height="125" rx="16"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#f3f7ff"><text x="185" y="350" font-size="25" font-weight="bold">Last known well</text><text x="185" y="390" font-size="21">Reliable baseline observed</text><text x="605" y="350" font-size="25" font-weight="bold">Discovery</text><text x="605" y="390" font-size="21">Symptoms found on waking</text><text x="1005" y="350" font-size="25" font-weight="bold">Assessment</text><text x="1005" y="390" font-size="21">Current findings recorded</text></g>
  <path d="M205 470H584" stroke="#f6c97d" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="395" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#f6c97d">Do not invent a precise onset here.</text>
  <text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#f3f7ff">Report dates, all relevant times, the witness source and uncertainty.</text>
  <text x="600" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#a9bad0">Not a treatment-window calculator or a reason to deny evaluation of a wake-up stroke.</text>
</svg>
