<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-label="Hydrostatic versus oncotic: directions, calculation, limit"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1100" height="720" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="29" fill="#17384b" >Hydrostatic versus oncotic: directions, calculation, limit</text><text x="35" y="85" font-size="20" fill="#17384b" >CLASSIC FOUR-FORCE MODEL: distinguish pressure-driven water movement from gas diffusion.</text><text x="115" y="140" font-size="23" fill="#17384b" >Pc: outward</text><text x="365" y="140" font-size="21" fill="#17384b" >Pi: inward if positive</text><text x="625" y="140" font-size="21" fill="#17384b" >Plasma pi-c: inward</text><text x="870" y="140" font-size="21" fill="#17384b" >Tissue pi-i: outward</text><rect x="55" y="185" width="990" height="140" rx="12" fill="#e5f2f8" stroke="#9ebac7" stroke-width="2"/><text x="78" y="222" font-size="22" fill="#17384b" >CAPILLARY LUMEN</text><text x="78" y="258" font-size="20" fill="#17384b" >Protein-related oncotic effects depend on the barrier and local gradients.</text><text x="55" y="440" font-size="21" fill="#17384b" >INTERSTITIAL SPACE</text><path d="M200,280 L200,400" fill="none" stroke="#a34636" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,400 L450,280" fill="none" stroke="#246d77" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,400 L700,280" fill="none" stroke="#246d77" stroke-width="3" marker-end="url(#arrow)"/><path d="M950,280 L950,400" fill="none" stroke="#a34636" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="484" font-size="25" fill="#17384b" >Classic driving pressure = (Pc - Pi) - (pi-c - pi-i)</text><text x="55" y="523" font-size="21" fill="#17384b" >Textbook simplification Pi = pi-i = 0: 35 - 25 = +10 mmHg outward.</text><text x="55" y="559" font-size="20" fill="#17384b" >Its venous-end example: 18 - 25 = -7 mmHg inward. Teaching values, not patient data.</text><rect x="45" y="586" width="1010" height="81" rx="12" fill="#f5efd9" stroke="#9ebac7" stroke-width="2"/><text x="65" y="617" font-size="22" fill="#17384b" >MODEL BOUNDARY: many tissues sustain slight steady-state filtration.</text><text x="65" y="648" font-size="19" fill="#17384b" >Glycocalyx, permeability and lymphatic return matter; no infusion or albumin dose follows.</text><text x="35" y="700" font-size="16" fill="#587080" >Original teaching schematic. Classical equation shown for learning; actual fluid flux requires further properties.</text></g></svg>