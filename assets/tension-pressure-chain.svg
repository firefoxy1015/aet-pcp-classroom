<path d="M825 400L670 447" fill="none" stroke="#17384b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="265" y="455" width="570" height="62" rx="12" fill="#edf2e7" stroke="#93a881" stroke-width="2"/>
<text x="295" y="493" font-size="22">Support + urgent authorized relief + reassessment</text>
<text x="34" y="549" font-size="18">No requirement to wait for tracheal deviation, JVD or every classic sign. Hemorrhage may coexist.</text>
<text x="34" y="572" font-size="16">Original mechanism diagram, not an anatomical needle-placement guide or an independent PCP authorization.</text>
