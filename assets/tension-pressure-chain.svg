<text x="82" y="269" font-size="25">BREATHING</text><text x="82" y="306" font-size="22">Less effective lung expansion</text><text x="82" y="341" font-size="22">Impaired ventilation / gas exchange</text><text x="82" y="377" font-size="22">Increasing distress or failure</text>
<rect x="605" y="230" width="450" height="170" rx="13" fill="#f5efd9" stroke="#b5a16a" stroke-width="2"/>
<text x="642" y="269" font-size="25">CIRCULATION</text><text x="642" y="306" font-size="22">Reduced venous return / filling</text><text x="642" y="341" font-size="22">Reduced useful cardiac output</text><text x="642" y="377" font-size="22">Worsening perfusion / possible arrest</text>
