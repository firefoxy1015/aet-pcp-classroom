<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Body-water compartments: an explicitly simplified model"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1100" height="590" fill="#fffdf8"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="29" fill="#17384b" >Body-water compartments: an explicitly simplified model</text><text x="35" y="86" font-size="21" fill="#17384b" >Illustrative adult total body water: 42 L. Not a measured patient or fluid prescription.</text><rect x="45" y="120" width="555" height="330" rx="12" fill="#e6f1f7" stroke="#9ebac7" stroke-width="2"/><rect x="630" y="120" width="425" height="330" rx="12" fill="#eef4e7" stroke="#9ebac7" stroke-width="2"/><text x="65" y="162" font-size="25" fill="#17384b" >INTRACELLULAR: about 28 L</text><text x="65" y="201" font-size="22" fill="#17384b" >Water inside cells</text><text x="65" y="240" font-size="20" fill="#17384b" >About two-thirds of this illustrative total</text><text x="65" y="286" font-size="20" fill="#17384b" >A cell membrane separates compartments.</text><text x="65" y="324" font-size="20" fill="#17384b" >Water shifts depend on effective solutes.</text><text x="650" y="162" font-size="24" fill="#17384b" >EXTRACELLULAR: about 14 L</text><rect x="650" y="188" width="385" height="88" rx="12" fill="#f8e7e2" stroke="#9ebac7" stroke-width="2"/><text x="668" y="222" font-size="23" fill="#17384b" >Plasma: about 3.5 L</text><text x="668" y="253" font-size="18" fill="#17384b" >Fluid component of blood</text><rect x="650" y="294" width="385" height="135" rx="12" fill="#f5efd9" stroke="#9ebac7" stroke-width="2"/><text x="668" y="329" font-size="21" fill="#17384b" >Non-plasma ECF: about 10.5 L</text><text x="668" y="365" font-size="20" fill="#17384b" >Mostly interstitial fluid</text><text x="668" y="401" font-size="17" fill="#17384b" >Transcellular fluid not separately drawn</text><text x="45" y="493" font-size="24" fill="#17384b" >Amount, location and concentration are different questions.</text><text x="45" y="531" font-size="22" fill="#17384b" >Interstitial edema can coexist with inadequate effective circulating volume.</text><text x="35" y="570" font-size="16" fill="#587080" >Original illustration. Fractions vary by age/body composition; infused fluid does not have one fixed distribution.</text></g></svg>